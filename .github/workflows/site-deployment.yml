name: Website Deployment

on:
  push:
    branches:
      - stem

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Site Deployment to Netlify
    steps:
      - name: Get the source code
        uses: actions/checkout@v4
        with:
          ref: stem
      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install project dependencies
        run: npm install

      # - name: Build
      #   run: npm run build
      #   env:
      #     CI: false

      - name: Install netlify CLI
        run: npm i -g netlify-cli@17.33.0

      - name: Deploy site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ADMIN_ID }}
        shell: bash
        run: |
          ntl deploy --site $NETLIFY_SITE_ID --auth $NETLIFY_AUTH_TOKEN \
            --dir .build \
            --build --prod \
            --message "A deploy from github actions"
